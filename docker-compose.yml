# docker compose up --build, then (first time) load the demo community:
#   docker compose exec app node dist/db/seed.js
# Open http://localhost:3000 and sign in as resident@larkspur.example / porchlight-demo
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: porchlight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d porchlight"]
      interval: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/porchlight
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -base64 48)}
      COOKIE_SECURE: "false" # plain http on localhost; keep the default (true) behind HTTPS
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
