name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/porchlight_test
    steps:
      - uses: actions/checkout@v5
      - name: Pull Postgres (with retries; registry pulls on CI runners sometimes fail)
        run: |
          for i in 1 2 3 4 5; do
            docker pull public.ecr.aws/docker/library/postgres:16-alpine && exit 0
            echo "pull failed (attempt $i), retrying"; sleep $((i * 10))
          done
          exit 1
      - name: Start Postgres
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=porchlight_test public.ecr.aws/docker/library/postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -h 127.0.0.1 -U postgres && exit 0; sleep 2; done
          docker logs pg; exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, test, build, browser tests
        shell: bash
        run: |
          set -o pipefail
          step() {
            echo "::group::$*"
            if ! "$@" > >(tee step.log) 2>&1; then
              # Surface the end of the log as an annotation so it's readable without opening the job log.
              echo "::error title=$*::$(tail -c 3500 step.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
              exit 1
            fi
            echo "::endgroup::"
          }
          step npm ci
          step npm test
          step npm run build
          step npx playwright install --with-deps chromium
          step npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t porchlight .
